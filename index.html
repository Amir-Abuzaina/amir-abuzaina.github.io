<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amir Abuzaina</title>
  <meta name="description" content="Amir Abuzaina: technical artist, rendering and tools.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="home">
  <!-- PLACEHOLDER LANDING: interactive dot field. Replace later with the bunny / sphere / teapot scene. -->
  <canvas id="field"></canvas>
  <div class="landing-note">// work in progress</div>

  <script src="assets/data.js"></script>
  <script src="assets/common.js"></script>
  <script>
    const c = document.getElementById("field"), g = c.getContext("2d");
    let W, H, dots = [], mouse = { x: -9999, y: -9999 };
    const GAP = 26, R = 120;
    function build() {
      const dpr = window.devicePixelRatio || 1;
      W = innerWidth; H = innerHeight;
      c.width = W * dpr; c.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
      dots = [];
      for (let y = GAP / 2; y < H; y += GAP)
        for (let x = GAP / 2; x < W; x += GAP) dots.push({ ox: x, oy: y, x, y });
    }
    function frame(t) {
      g.clearRect(0, 0, W, H);
      for (const d of dots) {
        const dx = d.ox - mouse.x, dy = d.oy - mouse.y, dist = Math.hypot(dx, dy);
        const push = dist < R ? (1 - dist / R) ** 2 * 40 : 0;
        const tx = d.ox + (dist ? dx / dist : 0) * push, ty = d.oy + (dist ? dy / dist : 0) * push;
        d.x += (tx - d.x) * 0.12; d.y += (ty - d.y) * 0.12;
        const wave = 0.5 + 0.5 * Math.sin(d.ox * 0.01 + d.oy * 0.013 + t * 0.0008);
        const near = dist < R ? 1 - dist / R : 0;
        g.fillStyle = near > 0 ? `rgba(217,178,95,${0.25 + near * 0.75})` : `rgba(214,211,204,${0.06 + wave * 0.12})`;
        g.beginPath(); g.arc(d.x, d.y, 1.2 + near * 1.3, 0, 6.283); g.fill();
      }
      requestAnimationFrame(frame);
    }
    addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    addEventListener("mouseleave", () => { mouse.x = mouse.y = -9999; });
    addEventListener("resize", build);
    build(); requestAnimationFrame(frame);
  </script>
</body>
</html>
