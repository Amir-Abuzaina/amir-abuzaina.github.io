<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amir Abuzaina</title>
  <meta name="description" content="Amir Abuzaina: technical artist, graphics.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="home">
  <!-- background: interactive dot field -->
  <canvas id="field"></canvas>

  <!-- centre: three discipline panels joined by bridges -->
  <section class="stage">
    <div class="stage-inner">
      <div class="panels" id="panels"></div>
      <!-- hover tray: moving thumbnails of the hovered category -->
      <div class="tray" id="tray"><div class="tray-track" id="track"></div></div>
    </div>
  </section>

  <!-- bottom: tools -->
  <div class="toolstrip" id="tools"></div>

  <script src="assets/data.js"></script>
  <script src="assets/common.js"></script>
  <script>
    // panels
    const el = document.getElementById("panels");
    const panelPoster = p => (PROJECTS.find(x => x.video === p.video || x.card === p.video) || {}).poster;
    const panelMedia = p => p.video ? `<video src="${vsrc(p.video, "sm")}" ${panelPoster(p) ? `poster="${panelPoster(p)}"` : ""} muted loop playsinline autoplay preload="auto"></video>`
      : p.image ? `<img src="${p.image}" alt="">` : '<div class="ph">[ LOOP ]</div>';
    el.innerHTML = SITE.panels.map((p, i) => `
      ${i ? '<div class="bridge"></div>' : ""}
      <a class="panel" href="portfolio.html?cat=${p.id}" data-cat="${p.id}" style="--c:${p.color}">
        <div class="frame">${panelMedia(p)}</div>
        <div class="cap"><h2>${p.label}</h2><div class="mini">${p.tags.map(cap).join(" · ")}</div></div>
      </a>`).join("");

    // hover tray: vertical 2-column bar of moving thumbnails under the hovered panel
    const stageInner = document.querySelector(".stage-inner");
    const tray = document.getElementById("tray"), track = document.getElementById("track");
    const touch = matchMedia("(hover: none), (max-width: 900px)").matches;
    let hideT, current = null;
    // still=true: poster image only (used for the duplicate set in the scrolling loop, so each clip decodes once)
    const thumb = (p, still) => `
      <a class="thumb" href="project.html?id=${p.id}">
        <div class="frame">${p.video && !still ? `<video src="${vsrc(p.card || p.video, "xs")}" muted loop playsinline autoplay preload="metadata"></video>` : p.poster ? `<img src="${isrc(p.poster, "medium")}" alt="" loading="lazy">` : '<div class="ph"></div>'}</div>
        <span>${p.title}</span>
      </a>`;
    function openTray(cat, panelEl) {
      clearTimeout(hideT);
      if (current === cat) return;
      current = cat;
      const panel = SITE.panels.find(x => x.id === cat);
      const list = PROJECTS.filter(p => p.categories.includes(cat));
      track.innerHTML = list.map(p => thumb(p)).join("");
      tray.style.setProperty("--c", panel.color);
      el.style.setProperty("--c", panel.color);
      // position from layout offsets (not getBoundingClientRect) so the hover scale-up can't skew it
      const SCALE = 1.07, cap = panelEl.querySelector(".cap");
      const pTop = panelEl.offsetTop, pH = panelEl.offsetHeight, cy = pTop + pH / 2;
      const capBottom = cy + (pTop + cap.offsetTop + cap.offsetHeight - cy) * SCALE;
      const innerTop = stageInner.parentElement.getBoundingClientRect().top + stageInner.offsetTop; // untransformed
      const wanted = 340, gap = 18, bottomLimit = innerHeight - 80, topLimit = 40;
      const below = bottomLimit - (innerTop + capBottom + gap);
      const panelTopScreen = innerTop + cy - (pH / 2) * SCALE;
      const lift = Math.max(0, Math.min(Math.max(wanted - below, 160), panelTopScreen - topLimit)); // always lift; header fades out meanwhile
      const h = Math.max(140, Math.min(wanted, below + lift));
      tray.style.height = h + "px";
      // bridges stretch on hover and nudge the panels sideways, so track the panel centre while that settles
      const follow = t0 => { const step = t => {
        const pr = panelEl.getBoundingClientRect(), ir = stageInner.getBoundingClientRect();
        tray.style.left = (pr.left + pr.width / 2 - ir.left) + "px";
        if (t - t0 < 600 && current === cat) requestAnimationFrame(step); };
        requestAnimationFrame(step); };
      follow(performance.now());
      tray.style.top = (capBottom + gap) + "px";
      stageInner.style.transform = `translateY(${-lift}px)`;
      track.classList.remove("scroll");
      requestAnimationFrame(() => {
        if (track.scrollHeight > h) {
          track.innerHTML += list.map(p => thumb(p)).join(""); // duplicate set for the seamless loop (videos too)
          track.style.setProperty("--dur", `${Math.ceil(list.length / 2) * 5}s`);
          track.classList.add("scroll");
        }
        track.querySelectorAll("video").forEach(v => { v.muted = true; v.play().catch(() => {}); });
      });
      tray.classList.add("open");
      document.body.classList.add("lifted");
      setGlow(panel.color, panelEl);
    }
    function closeTray() {
      hideT = setTimeout(() => { tray.classList.remove("open"); document.body.classList.remove("lifted"); setGlow(null, null); stageInner.style.transform = ""; current = null; }, 300);
    }

    if (!touch) {
      el.querySelectorAll(".panel").forEach(a => {
        a.addEventListener("mouseenter", () => openTray(a.dataset.cat, a));
        a.addEventListener("mouseleave", closeTray);
      });
      tray.addEventListener("mouseenter", () => clearTimeout(hideT));
      tray.addEventListener("mouseleave", closeTray);
    } else {
      // phones: first tap shows that category's projects under the card, second tap opens the category
      el.querySelectorAll(".panel").forEach(a => {
        const box = document.createElement("div");
        box.className = "m-thumbs";
        a.after(box);
        a.addEventListener("click", e => {
          if (a.classList.contains("expanded")) return;
          e.preventDefault();
          el.querySelectorAll(".panel.expanded").forEach(x => { x.classList.remove("expanded"); x.nextElementSibling.innerHTML = ""; });
          a.classList.add("expanded");
          box.style.setProperty("--c", a.style.getPropertyValue("--c"));
          box.innerHTML = PROJECTS.filter(p => p.categories.includes(a.dataset.cat)).map(p => thumb(p)).join("");
        });
      });
    }

    // startup: cards resolve from low mip levels up to full resolution (once per visit)
    (function mipIntro() {
      let seen = false;
      try { seen = sessionStorage.getItem("introSeen") === "1"; sessionStorage.setItem("introSeen", "1"); } catch (e) {}
      if (seen || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const LV = [3, 5, 9, 16, 30, 60, 120], DUR = 850, STAGGER = 120;
      document.body.classList.add("intro");
      el.querySelectorAll(".panel").forEach((a, i) => {
        const fr = a.querySelector(".frame"), src = panelPoster(SITE.panels[i]);
        const done = () => { a.classList.add("resolved"); };
        if (!src) return done();
        const cv = document.createElement("canvas");
        cv.className = "mip"; fr.appendChild(cv);
        const w = fr.clientWidth, h = fr.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
        cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
        const g2 = cv.getContext("2d");
        g2.fillStyle = "#111316"; g2.fillRect(0, 0, cv.width, cv.height);
        const finish = () => { cv.classList.add("done"); done(); setTimeout(() => cv.remove(), 500); };
        const bail = setTimeout(finish, 3000); // poster too slow: just show the card
        const im = new Image();
        const run = () => {
          clearTimeout(bail);
          const iw = im.naturalWidth, ih = im.naturalHeight, s = Math.max(w / iw, h / ih), sw = w / s, sh = h / s, sx = (iw - sw) / 2, sy = (ih - sh) / 2;
          const levels = LV.map(lw => {
            const c2 = document.createElement("canvas");
            c2.width = lw; c2.height = Math.max(1, Math.round(lw * h / w));
            c2.getContext("2d").drawImage(im, sx, sy, sw, sh, 0, 0, c2.width, c2.height);
            return c2;
          });
          const t0 = performance.now() + i * STAGGER;
          const step = now => {
            const k = (now - t0) / DUR;
            if (k < 0) return requestAnimationFrame(step);
            if (k >= 1) { g2.imageSmoothingEnabled = true; g2.drawImage(im, sx, sy, sw, sh, 0, 0, cv.width, cv.height); return finish(); }
            const L = levels[Math.min(LV.length - 1, Math.floor(k * LV.length))];
            g2.imageSmoothingEnabled = false;
            g2.drawImage(L, 0, 0, L.width, L.height, 0, 0, cv.width, cv.height);
            requestAnimationFrame(step);
          };
          requestAnimationFrame(step);
        };
        im.onload = run; im.onerror = finish; im.src = src;
      });
    })();

    document.getElementById("tools").innerHTML = SITE.tools.map(t => `<span class="tool" title="${t.name}">${t.logo ? `<img src="${t.logo}" alt="${t.name}">` : t.name}</span>`).join("");

    // dot field
    const c = document.getElementById("field"), g = c.getContext("2d");
    let W, H, dots = [], mouse = { x: -9999, y: -9999 };
    const GAP = 26, R = 120, HALO = 56;
    // glow colour follows the hovered card's category colour; a faint halo of dots rings the card
    const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    const GREEN = [103, 251, 201];
    let glow = [...GREEN], glowT = [...GREEN], halo = 0, haloT = 0, haloEl = null;
    function setGlow(color, el) {
      glowT = color ? hex(color) : [...GREEN];
      haloT = el ? 1 : 0;
      if (el) haloEl = el;
    }
    function build() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      c.width = W * dpr; c.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
      dots = [];
      for (let y = GAP / 2; y < H; y += GAP)
        for (let x = GAP / 2; x < W; x += GAP) dots.push({ ox: x, oy: y, x, y });
    }
    function frame(t) {
      g.clearRect(0, 0, W, H);
      for (let i = 0; i < 3; i++) glow[i] += (glowT[i] - glow[i]) * 0.14;   // ~0.3s ease
      halo += (haloT - halo) * 0.12;
      const rgb = glow.map(Math.round).join(",");
      const r = halo > 0.01 && haloEl ? haloEl.getBoundingClientRect() : null;
      const buckets = Array.from({ length: 8 }, () => new Path2D()), near = [], ring = [];
      for (const d of dots) {
        const dx = d.ox - mouse.x, dy = d.oy - mouse.y, dist = Math.hypot(dx, dy);
        if (dist < R || d.x !== d.ox || d.y !== d.oy) {
          const push = dist < R ? (1 - dist / R) ** 2 * 40 : 0;
          const tx = d.ox + (dist ? dx / dist : 0) * push, ty = d.oy + (dist ? dy / dist : 0) * push;
          d.x += (tx - d.x) * 0.12; d.y += (ty - d.y) * 0.12;
          if (Math.abs(d.x - d.ox) < 0.05 && Math.abs(d.y - d.oy) < 0.05 && dist >= R) { d.x = d.ox; d.y = d.oy; }
        }
        if (dist < R) { near.push([d, 1 - dist / R]); continue; }
        if (r) {
          const ex = Math.max(r.left - d.x, 0, d.x - r.right), ey = Math.max(r.top - d.y, 0, d.y - r.bottom);
          const e = Math.hypot(ex, ey);
          if (e > 0 && e < HALO) { ring.push([d, (1 - e / HALO) * halo]); continue; }
        }
        const wave = 0.5 + 0.5 * Math.sin(d.ox * 0.01 + d.oy * 0.013 + t * 0.0008);
        const path = buckets[Math.min(7, (wave * 8) | 0)];
        path.moveTo(d.x + 1.2, d.y); path.arc(d.x, d.y, 1.2, 0, 6.283);
      }
      buckets.forEach((path, i) => { g.fillStyle = `rgba(214,211,204,${0.06 + (i / 7) * 0.12})`; g.fill(path); });
      for (const [d, n] of ring) { g.fillStyle = `rgba(${rgb},${0.08 + n * 0.45})`; g.beginPath(); g.arc(d.x, d.y, 1.2 + n * 0.5, 0, 6.283); g.fill(); }
      for (const [d, n] of near) { g.fillStyle = `rgba(${rgb},${0.25 + n * 0.75})`; g.beginPath(); g.arc(d.x, d.y, 1.2 + n * 1.3, 0, 6.283); g.fill(); }
      requestAnimationFrame(frame);
    }
    addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    addEventListener("mouseleave", () => { mouse.x = mouse.y = -9999; });
    addEventListener("resize", build);
    build(); requestAnimationFrame(frame);
  </script>
</body>
</html>
