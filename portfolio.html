<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio | Amir Abuzaina</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="page">
    <div class="section-title">// PORTFOLIO</div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </main>

  <script src="assets/data.js"></script>
  <script src="assets/common.js"></script>
  <script>
    const cats = ["all", ...new Set(PROJECTS.map(p => p.category))];
    const fEl = document.getElementById("filters"), gEl = document.getElementById("grid");
    function render(cat) {
      fEl.innerHTML = cats.map(c => `<button class="${c === cat ? "on" : ""}" data-c="${c}">${c}</button>`).join("");
      gEl.innerHTML = PROJECTS.filter(p => cat === "all" || p.category === cat).map(p => `
        <a class="card" href="project.html?id=${p.id}">
          <div class="frame">${mediaHTML(p)}</div>
          <div class="card-meta">
            <h3>${p.title}</h3>
            <div class="tags">${p.tags.map(t => `<span>${t}</span>`).join("")}</div>
            <p>${p.summary}</p>
          </div>
        </a>`).join("");
      // play loop on hover
      gEl.querySelectorAll(".card").forEach(card => {
        const v = card.querySelector("video");
        if (!v) return;
        card.addEventListener("mouseenter", () => v.play());
        card.addEventListener("mouseleave", () => v.pause());
      });
    }
    fEl.addEventListener("click", e => e.target.dataset.c && render(e.target.dataset.c));
    render("all");
  </script>
</body>
</html>
