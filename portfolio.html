<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio | Amir Abuzaina</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="page">
    <div class="section-title">PORTFOLIO</div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </main>

  <script src="assets/data.js"></script>
  <script src="assets/common.js"></script>
  <script>
    const cats = { all: "all", ...CATEGORIES };
    const fEl = document.getElementById("filters"), gEl = document.getElementById("grid");
    function render(cat) {
      history.replaceState(null, "", cat === "all" ? "portfolio.html" : `portfolio.html?cat=${cat}`);
      fEl.innerHTML = Object.entries(cats).map(([k, v]) => `<button class="${k === cat ? "on" : ""}" data-c="${k}" style="--c:${(SITE.panels.find(x => x.id === k) || {}).color || "var(--accent)"}">${v}</button>`).join("");
      gEl.innerHTML = PROJECTS.filter(p => cat === "all" || p.categories.includes(cat)).map(p => `
        <a class="card ${p.aspect === "9:16" ? "vertical" : ""}" href="project.html?id=${p.id}">
          <div class="frame">${mediaHTML(p)}</div>
          <div class="card-meta">
            <h3>${p.title}</h3>
            <div class="tags">${p.tags.map(t => `<span>${cap(t)}</span>`).join("")}</div>
            <p>${p.summary}</p>
          </div>
        </a>`).join("");
      autoplayInView(gEl);
    }
    fEl.addEventListener("click", e => e.target.dataset.c && render(e.target.dataset.c));
    const q = new URLSearchParams(location.search).get("cat");
    render(cats[q] ? q : "all");
  </script>
</body>
</html>
